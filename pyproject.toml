[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG over documents and a SQL warehouse: one Postgres (pgvector + tsvector), Redis cache, Ollama LLM."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.2",
    "redis>=5.0",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "pypdf>=4.3",
    "tiktoken>=0.7",
    "prometheus-client>=0.20",
    "faker>=26.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0,<7"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers[postgres]>=4.7",
    "fakeredis>=2.23",
    "fpdf2>=2.7",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["enterprise_rag"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*", "testcontainers.*", "fakeredis.*", "fpdf.*", "faker.*", "tiktoken.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers Postgres)"]
addopts = "-ra"

[tool.coverage.run]
source = ["enterprise_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
