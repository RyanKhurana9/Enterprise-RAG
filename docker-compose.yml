name: enterprise-rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=512MB   # faster HNSW builds
      - -c
      - work_mem=32MB
      - -c
      - max_connections=200
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Containerised Ollama. Opt-in via `--profile ollama` (make up-ollama): on macOS Docker
  # has no GPU access, so the host's Ollama (Metal) is several times faster and is the default.
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      RAG_DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      RAG_READONLY_DATABASE_URL: postgresql+asyncpg://rag_readonly:readonly@postgres:5432/rag
      RAG_REDIS_URL: redis://redis:6379/0
      RAG_OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      HF_HOME: /models
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - hfcache:/models
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  ollama:
  hfcache:
