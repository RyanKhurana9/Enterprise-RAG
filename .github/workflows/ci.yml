name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        # No `rerank` extra: torch is large and the real-model test skips without weights.
        run: uv venv --python 3.11 .venv && uv pip install --python .venv -e ".[dev,ui]"
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests (unit + testcontainers integration)
        run: make test
